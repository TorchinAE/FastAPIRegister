server {
    listen 80;
    server_name 10games.ru;

    location = / {
        return 301 /quiz;
    }

    location /static/ {
        alias /root/FastAPIRegister/static/;
    }

    location /reg/static/ {
        alias /root/FastAPIRegister/static/;
    }

    location /reg/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /reg {
        return 301 /reg/;
    }

    location ~ ^/(login|register|logout|requests|counterparties|companies|users|directors|positions|equipment|materials|modules|invoices|settings|dashboard)(/|$) {
        rewrite ^(.*)$ /reg$1 last;
    }

    location /quiz/static/ {
        proxy_pass http://127.0.0.1:8080/static/;
        proxy_set_header Host $host;
    }

    location /quiz/pictures/ {
        proxy_pass http://127.0.0.1:8080/pictures/;
        proxy_set_header Host $host;
    }

    location /quiz/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /quiz {
        return 301 /quiz/;
    }
}
