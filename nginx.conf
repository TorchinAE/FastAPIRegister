server {
    listen 80;
    server_name 10games.ru;

    # --- robots.txt (static file) ---
    location = /robots.txt {
        alias /root/FastAPIRegister/static/robots.txt;
        access_log off;
    }

    # --- sitemap.xml (static file) ---
    location = /sitemap.xml {
        alias /root/FastAPIRegister/static/sitemap.xml;
        access_log off;
        default_type application/xml;
    }

    # --- Gzip compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Root redirect ---
    location = / {
        return 301 /quiz;
    }

    # --- Static files (long cache) ---
    location /static/ {
        alias /root/FastAPIRegister/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /reg/static/ {
        alias /root/FastAPIRegister/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- FastAPI app ---
    location /reg/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /reg {
        return 301 /reg/;
    }

    # --- Block indexing of auth pages ---
    location ~ ^/(login|register|logout)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        rewrite ^(.*)$ /reg$1 last;
    }

    # --- Rewrite internal app pages ---
    location ~ ^/(requests|counterparties|companies|users|directors|positions|equipment|materials|modules|invoices|settings|dashboard|contracts|nakladnye|fot|material-types|module-types-calc)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        rewrite ^(.*)$ /reg$1 last;
    }

    # --- Quiz app ---
    location /quiz/static/ {
        proxy_pass http://127.0.0.1:8080/static/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /quiz/pictures/ {
        proxy_pass http://127.0.0.1:8080/pictures/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /quiz/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /quiz {
        return 301 /quiz/;
    }

    # --- Block hidden files ---
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}