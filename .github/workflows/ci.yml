name: CI/CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]


jobs:
  # ==========================================
  # LINT
  # ==========================================
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check .

      - name: Run Ruff
        run: ruff check .


  # ==========================================
  # TEST
  # ==========================================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env for tests
        run: echo "NAME_BASE=registration" > .env

      - name: Run tests
        run: |
          pytest \
            --cov=scr \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml


  # ==========================================
  # DEPLOY
  # ==========================================
  deploy:
    needs: [lint, test]

    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m

          script: |
            set -e

            echo "======================================"
            echo "Starting deployment FastAPIRegister"
            echo "======================================"

            # --------------------------------------
            # Project
            # --------------------------------------

            cd /root/FastAPIRegister

            echo "Updating repository..."

            git config --global --add safe.directory /root/FastAPIRegister

            git remote set-url origin https://github.com/TorchinAE/FastAPIRegister.git

            git fetch origin main

            git reset --hard origin/main

            # --------------------------------------
            # Python environment (uv)
            # --------------------------------------

            echo "Setting up Python environment..."

            export PATH="$HOME/.local/bin:$PATH"

            if ! command -v uv &>/dev/null; then
              curl -LsSf https://astral.sh/uv/install.sh | sh
            fi

            uv sync

            echo "Running database migrations..."

            uv run alembic upgrade head

            # --------------------------------------
            # Systemd service
            # --------------------------------------

            echo "Updating systemd service..."

            sudo cp FastAPIRegister.service /etc/systemd/system/FastAPIRegister.service
            sudo systemctl daemon-reload

            # --------------------------------------
            # Secrets
            # --------------------------------------

            echo "Writing .env from GitHub Secrets..."

            {
              echo "NAME_BASE=registration"
              echo "REG_SECRET_KEY=${{ secrets.REG_SECRET_KEY }}"
              echo "REG_ADMIN_USERNAME=${{ secrets.REG_ADMIN_USERNAME }}"
              echo "REG_ADMIN_PASSWORD=${{ secrets.REG_ADMIN_PASSWORD }}"
              echo "MY_DOMEN=${{ secrets.MY_DOMEN }}"
              echo "MAIL_TO_REPORT=${{ secrets.MAIL_TO_REPORT }}"
            } > /root/FastAPIRegister/.env

            chmod 600 /root/FastAPIRegister/.env

            # --------------------------------------
            # Restart application
            # --------------------------------------

            echo "Restarting FastAPIRegister service..."

            sudo systemctl restart FastAPIRegister

            # --------------------------------------
            # Check systemd service
            # --------------------------------------

            echo "Checking FastAPIRegister service..."

            if ! sudo systemctl is-active --quiet FastAPIRegister; then
              echo "ERROR: FastAPIRegister service failed to start."
              echo ""
              echo "Service status:"
              sudo systemctl status FastAPIRegister --no-pager || true
              echo ""
              echo "Application logs:"
              sudo journalctl -u FastAPIRegister -n 100 --no-pager || true
              exit 1
            fi

            echo "FastAPIRegister service is active."

            # --------------------------------------
            # Wait for application
            # --------------------------------------

            echo "Waiting for application on port 8000..."

            APP_READY=false

            for i in {1..30}; do
              if curl -fsS http://127.0.0.1:8000/reg/ > /dev/null 2>&1; then
                APP_READY=true
                echo "Application is responding."
                break
              fi

              echo "Application is not ready yet... attempt $i/30"
              sleep 1
            done

            # --------------------------------------
            # Application failed to start
            # --------------------------------------

            if [ "$APP_READY" != "true" ]; then
              echo "ERROR: Application did not become ready within 30 seconds."
              echo ""
              echo "Service status:"
              sudo systemctl status FastAPIRegister --no-pager || true
              echo ""
              echo "Application logs:"
              sudo journalctl -u FastAPIRegister -n 100 --no-pager || true
              exit 1
            fi

            # --------------------------------------
            # Check nginx
            # --------------------------------------

            echo "Checking nginx..."

            if sudo systemctl is-active --quiet nginx; then
              echo "nginx is running."
            else
              echo "ERROR: nginx is not running."
              sudo systemctl status nginx --no-pager || true
              exit 1
            fi

            # --------------------------------------
            # Complete
            # --------------------------------------

            echo "======================================"
            echo "Deploy complete!"
            echo "======================================"