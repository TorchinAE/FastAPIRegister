<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сброс пароля</title>
    <link rel="stylesheet" href="/static/style.css?v={{ static_v }}">
</head>
<body class="auth-page">
    <div class="auth-box">
        <div class="auth-card">
            <h1>Новый пароль</h1>
            {% if invalid %}
            <div class="alert alert-error">Ссылка недействительна или устарела. Обратитесь к администратору за новой ссылкой.</div>
            <div class="auth-link"><a href="/reg/">Вход</a></div>
            {% elif done %}
            <div class="alert alert-success">Пароль изменён. Войдите с новым паролем.</div>
            <div class="auth-link"><a href="/reg/">Войти</a></div>
            {% else %}
            <p class="auth-subtitle">{{ email }}</p>
            {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
            <form method="post" action="/reg/reset-password">
                <input type="hidden" name="token" value="{{ token }}">
                <div class="form-group">
                    <label>Новый пароль</label>
                    <input type="password" name="password" required minlength="{{ min_length }}" placeholder="Минимум {{ min_length }} символов" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label>Повторите пароль</label>
                    <input type="password" name="password2" required minlength="{{ min_length }}" autocomplete="new-password">
                </div>
                <div class="actions">
                    <button type="submit" class="btn btn-primary" style="flex:1;justify-content:center;">Сохранить пароль</button>
                </div>
            </form>
            {% endif %}
        </div>
    </div>
</body>
</html>
