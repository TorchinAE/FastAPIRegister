<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page">
    <div class="auth-box">
        <div class="auth-card">
            <h1>Регистрация</h1>
            <p class="auth-subtitle">Создайте новый аккаунт</p>
            {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
            <form method="post" action="/register">
                <div class="form-group">
                    <label>Имя</label>
                    <input type="text" name="name" required placeholder="Иван Иванов">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required placeholder="name@company.ru">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" name="password" required minlength="6" placeholder="Минимум 6 символов">
                </div>
                <div class="actions">
                    <button type="submit" class="btn btn-success" style="flex:1;justify-content:center;">Зарегистрироваться</button>
                </div>
            </form>
            <div class="auth-link">Уже есть аккаунт? <a href="/">Войти</a></div>
        </div>
    </div>
</body>
</html>
