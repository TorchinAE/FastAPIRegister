{% extends "base.html" %}
{% block title %}Типы материалов{% endblock %}
{% block content %}
<div class="page-header" style="gap:1rem; flex-wrap:wrap;">
    <div style="display:flex; align-items:center; gap:0.75rem;">
        <h1>Типы материалов</h1>
        <span class="subtitle">Всего: {{ total }}</span>
    </div>
</div>
<form method="post" action="/reg/material-types" style="display:flex; gap:0.75rem; align-items:flex-end; margin-bottom:1rem; padding:1rem 1.25rem;">
    <div class="form-group" style="flex:1; margin-bottom:0;">
        <label>Новый тип</label>
        <input type="text" name="name" maxlength="20" placeholder="Введите тип материала" required>
    </div>
    <button type="submit" class="btn btn-success" style="height:38px;">Добавить</button>
</form>
<div class="table-wrap">
    <table id="dataTable" data-filter-table data-per-page="{{ per_page }}">
        <thead>
            <tr><th>ID</th><th>Тип</th><th title="Подсветка модулей этого типа на страницах расчёта">Цвет</th><th></th></tr>
            <tr class="table-filter">
                <th><input type="text" data-col="0" placeholder="Фильтр..." class="tf-input"></th>
                <th><input type="text" data-col="1" placeholder="Фильтр..." class="tf-input"></th>
                <th></th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr style="cursor:pointer" onclick="location.href='/reg/material-types/{{ item.id }}'">
                <td><strong>{{ item.id }}</strong></td>
                <td>{{ item.name }}</td>
                <td onclick="event.stopPropagation()" style="white-space:nowrap;width:120px">
                    <input type="color" class="type-color" value="{{ item.color or '#ffffff' }}" data-id="{{ item.id }}" data-empty="{{ '0' if item.color else '1' }}" title="Цвет подсветки в расчётах">
                    <button type="button" class="btn btn-ghost btn-sm btn-icon" title="Без подсветки" onclick="resetColor(this)">&#8856;</button>
                </td>
                <td style="text-align:center;width:40px">
                    <button class="btn btn-danger btn-sm btn-icon" title="Удалить" onclick="event.stopPropagation(); deleteType({{ item.id }}, this)">&#10005;</button>
                </td>
            </tr>
            {% endfor %}
            {% if not items %}<tr class="empty-row"><td colspan="4">Нет типов</td></tr>{% endif %}
        </tbody>
    </table>
</div>
<div id="toast" class="toast" style="display:none"></div>
{% endblock %}

{% block scripts %}
<script>
async function deleteType(id, btn) {
    if (!confirm('Удалить тип?')) return;
    const resp = await fetch(`/reg/api/material-types/${id}`, {method: 'DELETE'});
    if (resp.ok) { btn.closest('tr').remove(); showToast('Удалено'); } else { showToast('Ошибка удаления'); }
}
// Цвет подсветки типа: сохраняется сразу; «без подсветки» — пустой цвет
async function saveColor(input, color) {
    const resp = await fetch('/reg/api/material-types/', {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({id: parseInt(input.dataset.id), color}),
    });
    input.dataset.empty = color ? '0' : '1';
    showToast(resp.ok ? 'Цвет сохранён' : 'Ошибка сохранения');
}
function resetColor(btn) {
    const input = btn.parentElement.querySelector('.type-color');
    input.value = '#ffffff';
    saveColor(input, null);
}
document.querySelectorAll('.type-color').forEach(input => {
    input.addEventListener('change', () => saveColor(input, input.value));
});
function showToast(msg) {
    const t = document.getElementById('toast'); t.textContent = msg;
    t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2500);
}
</script>
{% endblock %}
