{% extends "base.html" %}
{% block title %}Тип {{ mt.name }}{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1>{{ mt.name }}</h1>
        <div class="subtitle">Тип материала #{{ mt.id }}</div>
    </div>
    <a href="{{ back_to or '/material-types' }}" class="btn btn-ghost">← Назад</a>
</div>

<div class="card">
    <form id="editForm">
        <input type="hidden" name="id" value="{{ mt.id }}">
        <div class="form-row" style="grid-template-columns: 1fr;">
            <div class="form-group">
                <label>Тип</label>
                <input type="text" name="name" value="{{ mt.name }}" maxlength="20" required style="width:100%;min-width:0">
            </div>
        </div>
        <div class="actions">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <button type="button" class="btn btn-danger" onclick="deleteType()">Удалить</button>
        </div>
    </form>
</div>

<div id="toast" class="toast" style="display:none"></div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('editForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const fd = new FormData(this);
    const data = { id: parseInt(fd.get('id')), name: fd.get('name') };
    const resp = await fetch('/reg/api/material-types/', {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data),
    });
    if (resp.ok) {
        showToast('Сохранено');
        setTimeout(() => window.location.href = '/reg/material-types/', 800);
    } else {
        const err = await resp.json();
        showToast('Ошибка: ' + (err.detail || 'не удалось сохранить'));
    }
});
async function deleteType() {
    if (!confirm('Удалить тип {{ mt.name }}?')) return;
    const resp = await fetch('/reg/api/material-types/{{ mt.id }}', {method: 'DELETE'});
    if (resp.ok) {
        window.location.href = '/reg/material-types';
    } else {
        showToast('Ошибка удаления');
    }
}
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2500);
}
</script>
{% endblock %}
