<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page">
    <div class="auth-box">
        <div class="auth-card">
            <h1>Вход</h1>
            <p class="auth-subtitle">Войдите в свой аккаунт</p>
            {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
            <form method="post" action="/login">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required placeholder="name@company.ru">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" name="password" required placeholder="Введите пароль">
                </div>
                <div class="actions">
                    <button type="submit" class="btn btn-primary" style="flex:1;justify-content:center;">Войти</button>
                </div>
            </form>
            <div class="auth-link">Нет аккаунта? <a href="/register">Зарегистрироваться</a></div>
        </div>
    </div>
</body>
</html>
