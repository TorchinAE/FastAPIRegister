<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-box { width: 100%; max-width: 360px; padding: 0 1rem; }
        .login-box form { max-width: 100%; }
        .login-box h1 { text-align: center; margin-bottom: 1.5rem; }
        .login-box .actions { justify-content: center; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Вход</h1>
        {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
        <form method="post" action="/login">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" required>
            </div>
            <div class="actions">
                <button type="submit" class="btn btn-primary">Войти</button>
                <a href="/register" class="btn btn-success">Регистрация</a>
            </div>
        </form>
    </div>
</body>
</html>
