{% extends "base.html" %}
{% block title %}Расчёт ТКП #{{ req.id }} — {{ section_label }}{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1>Расчёт ТКП — {{ section_label }}</h1>
        <div class="subtitle">Код: {{ req.id }} &middot; {{ req.tkp_num or '' }}</div>
    </div>
    <a href="/reg/requests/{{ req.id }}/calc" class="btn btn-ghost">&larr; Назад к расчёту</a>
</div>

<div class="card">
    <form id="serviceForm">
        <input type="hidden" name="id" value="{{ calc.id }}">
        <div class="form-row" style="grid-template-columns: 1fr;">
            <div class="form-group">
                <label>Описание</label>
                <input type="text" name="description" value="{{ calc.description or '' }}" style="width:100%;min-width:0" id="description">
            </div>
        </div>

        <div class="form-row" style="grid-template-columns: 1fr 1fr 1fr;margin-top:1rem;">
            <div class="form-group">
                <label>Себестоимость (₽)</label>
                <input type="number" name="base_cost" value="{{ calc.base_cost }}" min="0" step="0.01" style="width:100%;min-width:0" id="baseCost" oninput="recalcFromInputs()">
                <div class="financial-display" id="baseCostFmt" style="font-size:0.85rem;color:var(--text-muted);margin-top:0.25rem;"></div>
            </div>
            <div class="form-group">
                <label>Рентабельность (%)</label>
                <input type="number" id="profitPercent" name="profitability_percent" value="{{ profitability }}" min="0" max="100" step="0.01" style="width:100%;min-width:0;" oninput="recalcFromPercent()">
            </div>
            <div class="form-group">
                <label>Рентабельность (₽)</label>
                <div id="profitRub" readonly style="width:100%;min-width:0;background:#f8fafc;padding:0.5rem;border:1px solid var(--border,#e2e8f0);border-radius:6px;font-size:1rem;"></div>
            </div>
        </div>

        <div class="form-row" style="grid-template-columns: 1fr;margin-top:1rem;">
            <div class="form-group" style="max-width:300px;">
                <label>Конечная цена (₽)</label>
                <input type="number" id="finalPrice" min="0" step="0.01" style="width:100%;min-width:0;background:#f0fdf4;font-weight:bold;font-size:1.1rem;" oninput="recalcFromFinal()">
                <div class="financial-display" id="finalPriceFmt" style="font-size:0.95rem;font-weight:bold;color:#16a34a;margin-top:0.25rem;"></div>
            </div>
        </div>

        <div class="actions" style="margin-top:1.5rem;display:flex;gap:0.75rem;">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <button type="button" class="btn btn-danger" onclick="clearService()">Очистить</button>
        </div>
    </form>
</div>

<div id="toast" class="toast" style="display:none"></div>
{% endblock %}

{% block scripts %}
<script>
const reqId = {{ req.id }};
const calcId = {{ calc.id }};
const costField = '{{ cost_field }}';

let suppressInput = false;

function updateFinancialDisplays() {
    const baseCost = parseFloat(document.getElementById('baseCost').value) || 0;
    const finalPrice = parseFloat(document.getElementById('finalPrice').value) || 0;
    document.getElementById('baseCostFmt').textContent = baseCost > 0 ? formatFinancial(baseCost) : '';
    document.getElementById('finalPriceFmt').textContent = finalPrice > 0 ? formatFinancial(finalPrice) : '';
}

function recalcFromInputs() {
    if (suppressInput) return;
    const baseCost = parseFloat(document.getElementById('baseCost').value) || 0;
    const profitPercent = parseFloat(document.getElementById('profitPercent').value) || 0;
    const profitRub = baseCost * profitPercent / 100;
    const finalPrice = baseCost + profitRub;

    suppressInput = true;
    document.getElementById('profitRub').textContent = formatFinancial(profitRub);
    document.getElementById('finalPrice').value = finalPrice.toFixed(2);
    suppressInput = false;
    updateFinancialDisplays();
}

function recalcFromPercent() {
    if (suppressInput) return;
    const baseCost = parseFloat(document.getElementById('baseCost').value) || 0;
    const profitPercent = parseFloat(document.getElementById('profitPercent').value) || 0;
    const profitRub = baseCost * profitPercent / 100;
    const finalPrice = baseCost + profitRub;

    suppressInput = true;
    document.getElementById('profitRub').textContent = formatFinancial(profitRub);
    document.getElementById('finalPrice').value = finalPrice.toFixed(2);
    suppressInput = false;
    updateFinancialDisplays();
}

function recalcFromFinal() {
    if (suppressInput) return;
    const baseCost = parseFloat(document.getElementById('baseCost').value) || 0;
    const finalPrice = parseFloat(document.getElementById('finalPrice').value) || 0;
    const profitRub = finalPrice - baseCost;
    const profitPercent = baseCost > 0 ? (profitRub / baseCost * 100) : 0;

    suppressInput = true;
    document.getElementById('profitPercent').value = profitPercent.toFixed(2);
    document.getElementById('profitRub').textContent = formatFinancial(profitRub);
    suppressInput = false;
    updateFinancialDisplays();
}

(function() {
    suppressInput = true;
    const baseCost = parseFloat(document.getElementById('baseCost').value) || 0;
    const profitPercent = parseFloat(document.getElementById('profitPercent').value) || 0;
    const savedFinal = parseFloat('{{ calc.final_price }}') || 0;

    if (savedFinal > 0) {
        document.getElementById('finalPrice').value = savedFinal.toFixed(2);
        const profitRub = savedFinal - baseCost;
        const calcPercent = baseCost > 0 ? (profitRub / baseCost * 100) : 0;
        document.getElementById('profitPercent').value = calcPercent.toFixed(2);
        document.getElementById('profitRub').textContent = formatFinancial(profitRub);
    } else {
        const profitRub = baseCost * profitPercent / 100;
        document.getElementById('profitRub').textContent = formatFinancial(profitRub);
        document.getElementById('finalPrice').value = (baseCost + profitRub).toFixed(2);
    }
    updateFinancialDisplays();
    suppressInput = false;
})();

document.getElementById('serviceForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const fd = new FormData(this);
    const finalPrice = parseFloat(document.getElementById('finalPrice').value) || 0;
    const profitPercent = parseFloat(document.getElementById('profitPercent').value) || 0;
    const data = {
        id: parseInt(fd.get('id')),
        description: fd.get('description') || null,
        base_cost: parseFloat(fd.get('base_cost')) || 0,
        quantity: 1,
        profitability_percent: profitPercent,
        final_price: finalPrice,
    };
    const resp = await fetch('/reg/api/service-calcs/' + calcId, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data),
    });
    if (resp.ok) {
        await fetch('/reg/api/requests/' + reqId, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id: reqId, [costField]: finalPrice}),
        });
        showToast('Сохранено');
    } else {
        const err = await resp.json();
        showToast('Ошибка: ' + (err.detail || 'не удалось сохранить'));
    }
});

async function clearService() {
    if (!confirm('Очистить все данные?')) return;
    const resp = await fetch('/reg/api/service-calcs/' + calcId, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({id: calcId, description: null, base_cost: 0, quantity: 1, profitability_percent: 0, final_price: 0}),
    });
    if (resp.ok) {
        await fetch('/reg/api/requests/' + reqId, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id: reqId, [costField]: 0}),
        });
        document.getElementById('description').value = '';
        document.getElementById('baseCost').value = '0';
        document.getElementById('profitPercent').value = '0';
        document.getElementById('profitRub').textContent = formatFinancial(0);
        recalcFromInputs();
        showToast('Очищено');
    } else {
        showToast('Ошибка очистки');
    }
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2500);
}
</script>
{% endblock %}
