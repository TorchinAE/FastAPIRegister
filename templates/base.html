<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Регистрация ТКП{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <button class="hamburger" onclick="toggleSidebar()">&#9776;</button>
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    <div class="app">
        <aside class="sidebar" id="sidebar">
            <div class="brand">Регистрация запросов</div>
            <nav>
                <a href="/requests" class="{{ 'active' if active_page == 'requests' else '' }}"><span class="icon">&#9993;</span> ТКП</a>
                <a href="/counterparties" class="{{ 'active' if active_page == 'counterparties' else '' }}"><span class="icon">&#9823;</span> Контрагенты</a>
                <a href="/companies" class="{{ 'active' if active_page == 'companies' else '' }}"><span class="icon">&#9960;</span> Компании</a>
                <a href="/equipment" class="{{ 'active' if active_page == 'equipment' else '' }}"><span class="icon">&#9881;</span> Оборудование</a>
                <a href="/users" class="{{ 'active' if active_page == 'users' else '' }}"><span class="icon">&#9824;</span> Пользователи</a>
                <a href="/directors" class="{{ 'active' if active_page == 'directors' else '' }}"><span class="icon">&#9733;</span> Директора</a>
                <a href="/positions" class="{{ 'active' if active_page == 'positions' else '' }}"><span class="icon">&#9830;</span> Должности</a>
            </nav>
            {% if user %}
            <div class="user-section">
                <div class="user-name">{{ user.name }}</div>
                <div class="user-email">{{ user.email }}</div>
                <a href="/logout">Выйти</a>
            </div>
            {% endif %}
        </aside>
        <main class="main-content fade-in">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('overlay').classList.remove('open');
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
