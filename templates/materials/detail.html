{% extends "base.html" %}
{% block title %}{{ mat.name }}{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1>{{ mat.name }}</h1>
        <div class="subtitle">Материал #{{ mat.id }}</div>
    </div>
    <a href="{{ back_to or '/materials' }}" class="btn btn-ghost">← Назад</a>
</div>

<div class="card">
    <form id="editMatForm">
        <input type="hidden" name="id" value="{{ mat.id }}">
        <div class="form-row" style="grid-template-columns: 1fr 1fr 1fr;">
            <div class="form-group">
                <label>Название</label>
                <input type="text" name="name" value="{{ mat.name }}" required style="width:100%;min-width:0">
            </div>
            <div class="form-group">
                <label>Цена</label>
                <input type="number" name="price" value="{{ mat.price }}" step="0.01" min="0" style="width:100%;min-width:0">
            </div>
            <div class="form-group">
                <label>Тип</label>
                <select name="type_id" style="width:100%;min-width:0">
                    <option value="">—</option>
                    {% for t in types %}<option value="{{ t.id }}" {{ 'selected' if mat.type_id == t.id else '' }}>{{ t.name }}</option>{% endfor %}
                </select>
            </div>
        </div>
        <div class="form-row" style="grid-template-columns: 1fr 1fr 1fr;">
            <div class="form-group">
                <label>Код 1С</label>
                <input type="text" name="code_1c" value="{{ mat.code_1c or '' }}" style="width:100%;min-width:0">
            </div>
            <div class="form-group">
                <label>Код агент</label>
                <input type="text" name="code_agent" value="{{ mat.code_agent or '' }}" style="width:100%;min-width:0">
            </div>
            <div class="form-group">
                <label>URL агент</label>
                <input type="text" name="url_agent" value="{{ mat.url_agent or '' }}" style="width:100%;min-width:0">
            </div>
        </div>
        <div class="form-group" style="max-width:200px;">
            <label>Ном Ток</label>
            <input type="number" name="nom_tok" id="nom_tok" value="{{ mat.nom_tok }}" min="0" max="7000" style="width:100%;min-width:0">
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:0.5rem 1.5rem;padding:0.75rem 0;">
            <label style="display:flex;align-items:center;gap:0.4rem;cursor:pointer;"><input type="checkbox" name="stats" {{ 'checked' if mat.stats else '' }}> стац</label>
            <label style="display:flex;align-items:center;gap:0.4rem;cursor:pointer;"><input type="checkbox" name="vtych" {{ 'checked' if mat.vtych else '' }}> втыч</label>
            <label style="display:flex;align-items:center;gap:0.4rem;cursor:pointer;"><input type="checkbox" name="vykat" {{ 'checked' if mat.vykat else '' }}> выкат</label>
            <label style="display:flex;align-items:center;gap:0.4rem;cursor:pointer;"><input type="checkbox" name="ruchn" {{ 'checked' if mat.ruchn else '' }}> ручн</label>
            <label style="display:flex;align-items:center;gap:0.4rem;cursor:pointer;"><input type="checkbox" name="el_priv" {{ 'checked' if mat.el_priv else '' }}> эл.прив</label>
        </div>
        <div class="actions">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <button type="button" class="btn btn-danger" onclick="deleteMat()">Удалить</button>
        </div>
    </form>
</div>

<div id="toast" class="toast" style="display:none"></div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('editMatForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const fd = new FormData(this);
    const data = {
        id: parseInt(fd.get('id')),
        name: fd.get('name'),
        price: parseFloat(fd.get('price')) || 0,
        code_1c: fd.get('code_1c') || null,
        code_agent: fd.get('code_agent') || null,
        url_agent: fd.get('url_agent') || null,
        type_id: fd.get('type_id') ? parseInt(fd.get('type_id')) : null,
        nom_tok: parseInt(fd.get('nom_tok')) || 0,
        stats: this.querySelector('[name="stats"]').checked,
        vtych: this.querySelector('[name="vtych"]').checked,
        vykat: this.querySelector('[name="vykat"]').checked,
        ruchn: this.querySelector('[name="ruchn"]').checked,
        el_priv: this.querySelector('[name="el_priv"]').checked,
    };
    const resp = await fetch('/reg/api/materials/', {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data),
    });
    if (resp.ok) {
        showToast('Сохранено');
        setTimeout(() => window.location.href = '/reg/materials/', 800);
    } else {
        const err = await resp.json();
        showToast('Ошибка: ' + (err.detail || 'не удалось сохранить'));
    }
});

async function deleteMat() {
    if (!confirm('Удалить материал {{ mat.name }}?')) return;
    const resp = await fetch('/reg/api/materials/{{ mat.id }}', {method: 'DELETE'});
    if (resp.ok) {
        window.location.href = '/reg/materials';
    } else {
        showToast('Ошибка удаления');
    }
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2500);
}

// If nom_tok is 0, uncheck all boolean fields
document.getElementById('nom_tok').addEventListener('input', function() {
    if (parseInt(this.value) === 0 || this.value === '') {
        document.querySelectorAll('[name="stats"], [name="vtych"], [name="vykat"], [name="ruchn"], [name="el_priv"]').forEach(cb => {
            cb.checked = false;
        });
    }
});
</script>
{% endblock %}
