[project]
name = "fastapi-register"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy~=2.0.44",
    "fastapi~=0.121.1",
    "pydantic~=2.12.4",
    "uvicorn~=0.38.0",
    "watchfiles~=1.1.1",
    "pydantic-settings~=2.11.0",
    "aiosqlite>=0.20.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.0",
    "openpyxl>=3.1.0",
    "alembic>=1.20.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
exclude = ["alembic/versions/*"]

[tool.ruff.lint]
ignore = ["B008", "F401", "DTZ005", "DTZ007", "DTZ011"]
